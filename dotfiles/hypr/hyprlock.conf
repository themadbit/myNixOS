# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = Adwaita Sans
$fg = rgb(c8ccd4)
$muted = rgb(5c6370)
$accent = rgb(8aa4c8)
$urgent = rgb(d08770)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 240, 40
    outline_thickness = 1
    rounding = 6

    inner_color = rgba(11131899)
    outer_color = $muted
    check_color = $accent
    fail_color = $urgent
    font_color = $fg

    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL
    fade_on_empty = true
    dots_size = 0.2
    dots_spacing = 0.4

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 56
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 13
    font_family = $font

    position = 0, 10
    halign = center
    valign = center
}
